<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Polyrhythm Drummer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 8px 24px 8px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .controls {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      max-width: 360px;
      width: 100%;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 700;
    }

    select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    #r1 { border-color: #06b6d4; color: #06b6d4; }
    #r2 { border-color: #f59e0b; color: #f59e0b; }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.running { background: #ef4444; }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 340px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .hud-val {
      color: #38bdf8;
      font-weight: 700;
    }

    canvas {
      background: #020617;
      border: 2px solid #334155;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      display: block;
    }

    .drum-pads {
      display: flex;
      width: 340px;
      height: 120px;
      border: 2px solid #334155;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      background: #090d16;
    }

    .pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }

    .pad-divider {
      width: 2px;
      background: #334155;
    }

    .pad-left { border-right: 1px solid #334155; }

    .pad-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .pad-left .pad-title { color: #06b6d4; }
    .pad-right .pad-title { color: #f59e0b; }

    .pad-hint {
      font-size: 0.7rem;
      color: #64748b;
    }

    .pad.hit-good {
      background: rgba(34, 197, 94, 0.35) !important;
    }

    .pad.hit-miss {
      background: rgba(239, 68, 68, 0.4) !important;
    }

    .feedback-pill {
      position: absolute;
      top: 10px;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .feedback-pill.show { opacity: 1; }
    .feedback-pill.good { background: #22c55e; color: #fff; }
    .feedback-pill.bad { background: #ef4444; color: #fff; }
  </style>
</head>

  </header>
