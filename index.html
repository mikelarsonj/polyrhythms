<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polyrhythm Metronome</title>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px 8px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px 0;
    }
    p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0 0 16px 0;
    }
    .controls {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
    }
    select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      outline: none;
    }
    #r1 { border-color: #06b6d4; color: #06b6d4; }
    #r2 { border-color: #f59e0b; color: #f59e0b; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button.running {
      background: #dc2626;
    }
    canvas {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      display: block;
    }
  </style>
</head>
<body>

  <h1>Polyrhythm Metronome</h1>
  <p>Percussive Visualizer</p>

  <div class="controls">
    <div class="group">
      <label>Ratio:</label>
      <select id="r1">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
      <span style="font-weight:bold;color:#94a3b8">:</span>
      <select id="r2">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>

    <div class="group">
      <label>Cycle:</label>
      <select id="dur">
        <option value="1">1 s</option>
        <option value="2" selected>2 s</option>
        <option value="3">3 s</option>
        <option value="4">4 s</option>
        <option value="5">5 s</option>
        <option value="6">6 s</option>
        <option value="7">7 s</option>
        <option value="8">8 s</option>
      </select>
    </div>

    <button id="btn">Start</button>
  </div>

  <canvas id="cv" width="360" height="360"></canvas>

  <script>
    var audioCtx = null;

    function getAudio() {
      if (!audioCtx) {
        var Cls = window.AudioContext || window.webkitAudioContext;
        if (Cls) audioCtx = new Cls();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Woodblock hit (Lane 1)
    function playWoodblock() {
      var ac = getAudio();
      if (!ac) return;
      var t = ac.currentTime;

      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(260, t + 0.04);

      gain.gain.setValueAtTime(0.7, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.045);
    }

    // High Clave click (Lane 2)
    function playClave() {
      var ac = getAudio();
      if (!ac) return;
      var t = ac.currentTime;

      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2400, t);
      osc.frequency.exponentialRampToValueAtTime(1400, t + 0.03);

      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.035);
    }

    var canvas = document.getElementById('cv');
    var ctx = canvas.getContext('2d');
    var btn = document.getElementById('btn');
    var r1Sel = document.getElementById('r1');
    var r2Sel = document.getElementById('r2');
    var durSel = document.getElementById('dur');

    var isRunning = false;
    var r1 = 3;
    var r2 = 4;
    var cycleDuration = 2;

    var cycleProgress = 0;
    var lastTime = null;
    var hit1 = {};
    var hit2 = {};

    var HIT_Y = 290;
    var BAR_H = 10;

    function draw() {
      var w = canvas.width;
      var h = canvas.height;
      var mid = w / 2;
      var lw = 120;

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, w, h);

      // Center line
      ctx.fillStyle = '#334155';
      ctx.fillRect(mid - 1, 0, 2, h);

      // Hit line
      ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
      ctx.fillRect(10, HIT_Y - 6, w - 20, 12);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(10, HIT_Y - 1, w - 20, 2);

      // Lane 1 (Cyan)
      ctx.fillStyle = '#06b6d4';
      for (var i = 0; i < r1; i++) {
        var p1 = (cycleProgress - (i / r1)) % 1.0;
        if (p1 < 0) p1 += 1.0;
        ctx.fillRect(mid - lw - 10, (p1 * HIT_Y) - (BAR_H / 2), lw, BAR_H);
      }

      // Lane 2 (Amber)
      ctx.fillStyle = '#f59e0b';
      for (var j = 0; j < r2; j++) {
        var p2 = (cycleProgress - (j / r2)) % 1.0;
        if (p2 < 0) p2 += 1.0;
        ctx.fillRect(mid + 10, (p2 * HIT_Y) - (BAR_H / 2), lw, BAR_H);
      }
    }

    function loop(now) {
      if (!isRunning) return;
      var dt = (now - lastTime) / 1000;
      lastTime = now;

      var prev = cycleProgress;
      cycleProgress = (cycleProgress + (dt / cycleDuration)) % 1.0;

      if (cycleProgress < prev) {
        hit1 = {};
        hit2 = {};
      }

      for (var i = 0; i < r1; i++) {
        if (cycleProgress >= (i / r1) && !hit1
