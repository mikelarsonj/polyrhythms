<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Polyrhythm Drummer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;user-select:none;touch-action:manipulation}
body{background:#0b1120;color:#fff;display:flex;flex-direction:column;align-items:center;padding:12px 8px}
h1{font-size:1.3rem;margin-bottom:8px}
.bar{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
select,button{background:#0f172a;color:#fff;border:1px solid #475569;padding:6px;border-radius:6px;font-weight:700;font-size:1rem}
#r1{color:#06b6d4;border-color:#06b6d4}
#r2{color:#f59e0b;border-color:#f59e0b}
#btn{background:#2563eb;border:none;padding:6px 14px}
#btn.on{background:#ef4444}
#hud{font-size:.85rem;color:#94a3b8;margin-bottom:6px;display:flex;gap:12px}
#hud b{color:#38bdf8}
canvas{background:#020617;border:2px solid #334155;border-bottom:none;border-radius:8px 8px 0 0;display:block}
.pads{display:flex;width:320px;height:120px;border:2px solid #334155;border-radius:0 0 8px 8px;overflow:hidden}
.pad{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090d16;touch-action:none;font-weight:800;font-size:1rem}
#p1{border-right:1px solid #334155;color:#06b6d4}
#p2{border-left:1px solid #334155;color:#f59e0b}
.hit-ok{background:#15803d !important}
.hit-bad{background:#b91c1c !important}
</style>
</head>
<body>
<h1>Polyrhythm Drummer (v10)</h1>
<div class="bar">
  <select id="r1"></select>:<select id="r2"></select>
  <select id="dur"></select>
  <button id="btn">Start</button>
</div>
<div id="hud">Streak: <b id="stk">0</b> | Score: <b id="sc">0/0</b></div>
<canvas id="cv" width="320" height="220"></canvas>
<div class="pads">
  <div id="p1" class="pad">LEFT<br><small style="color:#64748b;font-size:.7rem">Cyan</small></div>
  <div id="p2" class="pad">RIGHT<br><small style="color:#64748b;font-size:.7rem">Amber</small></div>
</div>
<script>
var ac=null, r1=3, r2=4, dur=2, run=false, prog=0, tLast=null;
var hM1={}, hM2={}, hU1={}, hU2={}, streak=0, good=0, tot=0;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var b=document.getElementById('btn'), s1=document.getElementById('r1'), s2=document.getElementById('r2'), sd=document.getElementById('dur');
var p1=document.getElementById('p1'), p2=document.getElementById('p2');

for(var i=1;i<=8;i++){
  s1.add(new Option(i,i,false,i===3));
  s2.add(new Option(i,i,false,i===4));
  sd.add(new Option(i+'s',i,false,i===2));
}

function snd(f, decay, type, fEnd){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    var o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type||'sine';
    o.frequency.setValueAtTime(f, t);
    if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t+decay);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+decay);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+decay);
  }catch(e){}
}
function playLow(){ snd(750, 0.045, 'sine', 200); }
function playHigh(){ snd(2200, 0.035, 'sine', 1100); }
function playBad(){ snd(120, 0.08, 'sawtooth', 50); }

function tap(lane){
  if(!run) return;
  tot++;
  var beats = (lane===1)?r1:r2, map = (lane===1)?hU1:hU2, pad = (lane===1)?p1:p2;
  var nowSec = prog * dur, ok = false, best = 99, idx = -1;
  for(var i=0;i<beats;i++){
    var d = Math.abs(nowSec - (i/beats)*dur);
    d = Math.min(d, Math.abs(d-dur));
    if(d < best){ best = d; idx = i; }
  }
  if(best <= 0.14 && !map[idx]){ map[idx] = true; ok = true; }
  pad.className = 'pad ' + (ok ? 'hit-ok' : 'hit-bad');
  setTimeout(function(){ pad.className='pad'; }, 120);
  if(ok){
    streak++; good++;
    if(lane===1) playLow(); else playHigh();
  } else {
    streak = 0; playBad();
  }
  document.getElementById('stk').textContent = streak;
  document.getElementById('sc').textContent = good + '/' + tot;
}

p1.addEventListener('pointerdown', function(e){ e.preventDefault(); tap(1); });
p2.addEventListener('pointerdown', function(e){ e.preventDefault(); tap(2); });

function draw(){
  ctx.fillStyle='#020617'; ctx.fillRect(0,0,320,220);
  ctx.fillStyle='#334155'; ctx.fillRect(159,0,2,220);
  ctx.fillStyle='rgba(239,68,68,0.25)'; ctx.fillRect(10,185,300,14);
  ctx.fillStyle='#ef4444'; ctx.fillRect(10,191,300,2);
  ctx.fillStyle='#06b6d4';
  for(var i=0;i<r1;i++){
    var y=((prog - i/r1)%1+1)%1 * 192;
    ctx.fillRect(20, y-5, 125, 10);
  }
  ctx.fillStyle='#f59e0b';
  for(var j=0;j<r2;j++){
    var y2=((prog - j/r2)%1+1)%1 * 192;
    ctx.fillRect(175, y2-5, 125, 10);
  }
}

function loop(t){
  if(!run) return;
  var dt = (t - tLast)/1000; tLast = t;
  var prev = prog;
  prog = (prog + dt/dur) % 1.0;
  if(prog < prev){ hM1={}; hM2={}; hU1={}; hU2={}; }
  for(var i=0;i<r1;i++) if(prog >= i/r1 && !hM1[i]){ playLow(); hM1[i]=true; }
  for(var j=0;j<r2;j++) if(prog >= j/r2 && !hM2[j]){ playHigh(); hM2[j]=true; }
  draw();
  requestAnimationFrame(loop);
}

b.onclick = function(){
  try{if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); ac.resume();}catch(e){}
  run = !run;
  b.textContent = run ? 'Stop' : 'Start';
  b.className = run ? 'on' : '';
  if(run){ tLast = performance.now(); requestAnimationFrame(loop); }
  else { prog=0; hM1={}; hM2={}; hU1={}; hU2={}; draw(); }
};
s1.onchange = function(){ r1 = parseInt(s1.value); hM1={}; if(!run) draw(); };
s2.onchange = function(){ r2 = parseInt(s2.value); hM2={}; if(!run) draw(); };
sd.onchange = function(){ dur = parseInt(sd.value); };

draw();
</script>
</body>
</html>
