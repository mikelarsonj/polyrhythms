<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Polyrhythm Metronome</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #06b6d4;
      --amber: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 8px 24px 8px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      max-width: 380px;
      width: 100%;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    #r1 { border-color: var(--cyan); color: var(--cyan); }
    #r2 { border-color: var(--amber); color: var(--amber); }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.running { background: var(--red); }

    /* Scoreboard HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .hud-val {
      color: #38bdf8;
      font-weight: 700;
    }

    /* Waterfall Canvas */
    canvas {
      background: #020617;
      border: 2px solid var(--border);
